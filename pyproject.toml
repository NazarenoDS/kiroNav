[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# NOTE: metadata, ruff and pytest configuration only. See the comment near
# [project.optional-dependencies] about packaging.

[project]
name = "kiroNav"
version = "0.1.0"
description = "AI-powered software navigation assistant - the ghost that helps you USE any software"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "KiroNav Team" }
]
keywords = ["ai", "assistant", "navigation", "kiro", "tutorial", "guide", "screen-reader"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "flet>=0.86.0",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

# KiroNav runs as an app (`python main.py`), not as an installed package,
# so no wheel target or console script is declared here.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
